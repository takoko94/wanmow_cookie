<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280,height=720">

<title>わんも～推し犬総選挙 結果発表</title>

<style>

@font-face{
  font-family:'Panda';
  src:url('pandabakery.ttf');
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  width:1280px;
  height:720px;

  overflow:hidden;

  position:relative;

  font-family:'Panda',sans-serif;

  background:
    linear-gradient(
      180deg,
      #fff8fb 0%,
      #ffeef5 100%
    );
}

/* 背景 */

.bgCircle{

  position:absolute;

  border-radius:999px;

  background:
    rgba(255,255,255,0.5);
}

.circle1{
  width:300px;
  height:300px;
  left:-80px;
  top:-80px;
}

.circle2{
  width:220px;
  height:220px;
  right:-50px;
  top:120px;
}

.circle3{
  width:260px;
  height:260px;
  bottom:-100px;
  right:250px;
}

/* タイトル */

.titleArea{

  width:100%;

  text-align:center;

  padding-top:42px;

  position:relative;

  z-index:10;
}

.subTitle{

  font-size:28px;

  color:#9a7b68;

  letter-spacing:2px;

  margin-bottom:10px;

  text-shadow:
    0 2px 6px rgba(255,255,255,0.9);
}

.mainTitle{

  font-size:78px;

  color:#ff8fb0;

  letter-spacing:4px;

  text-shadow:
    0 4px 0 #fff,
    0 8px 18px rgba(255,143,176,0.35);
}

.desc{

  margin-top:12px;

  font-size:30px;

  color:#8f6f5f;
}

/* 犬一覧 */

.dogWrap{

  width:1180px;

  margin:42px auto 0 auto;

  display:flex;

  justify-content:center;

  gap:18px;
}

/* カード */

.card{

  width:180px;

  background:
    rgba(255,255,255,0.9);

  border-radius:34px;

  padding:
    18px
    14px
    20px;

  text-align:center;

  box-shadow:
    0 10px 22px rgba(0,0,0,0.08);

  position:relative;
}

.rank{

  font-size:34px;

  color:#ff8fb0;

  margin-bottom:10px;
}

.card img{

  width:130px;
  height:130px;

  border-radius:999px;

  object-fit:cover;

  border:6px solid white;
}

.name{

  margin-top:16px;

  font-size:30px;

  color:#ff8fb0;

  line-height:1.15;

  text-shadow:
    0 2px 0 #fff;
}

</style>
</head>

<body>

<div class="bgCircle circle1"></div>
<div class="bgCircle circle2"></div>
<div class="bgCircle circle3"></div>

<div class="titleArea">

  <div class="subTitle">
    わんも～推し犬総選挙
  </div>

  <div class="mainTitle">
    クッキー化決定!!
  </div>

  <div class="desc">
    最終的にクッキー化になったワンちゃんはこの6匹！
  </div>

</div>

<div class="dogWrap">

  <div class="card">

    <div class="rank">🥇</div>

    <img src="pomeranian.png">

    <div class="name">
      ポメラニアン
    </div>

  </div>

  <div class="card">

    <div class="rank">🥈</div>

    <img src="husky.png">

    <div class="name">
      ハスキー
    </div>

  </div>

  <div class="card">

    <div class="rank">🥉</div>

    <img src="pug.png">

    <div class="name">
      パグ
    </div>

  </div>

  <div class="card">

    <div class="rank">4位</div>

    <img src="poodle.png">

    <div class="name">
      プードル
    </div>

  </div>

  <div class="card">

    <div class="rank">5位</div>

    <img src="chihuahua.png">

    <div class="name">
      チワワ
    </div>

  </div>

  <div class="card">

    <div class="rank">特別枠</div>

    <img src="shiba.png">

    <div class="name">
      柴犬
    </div>

  </div>

</div>

</body>
</html>
